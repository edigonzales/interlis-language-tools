name: Publish VS Code extension

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pre_release:
        description: Publish as a Marketplace pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VSIX_PRE_RELEASE: ${{ (github.event_name == 'workflow_run' || inputs.pre_release) && '1' || '0' }}
      CI_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
      CI_RUN_CREATED_AT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.created_at || '' }}
    steps:
      - name: Checkout language tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: interlis-language-tools
          persist-credentials: false
      - name: Checkout compiler packages
        uses: actions/checkout@v6
        with:
          repository: edigonzales/ilic-fork
          path: ilic-fork
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: interlis-language-tools/pnpm-lock.yaml
      - name: Build compiler WASM
        shell: bash
        working-directory: ilic-fork
        run: |
          set -euo pipefail
          emscripten_version=$(tr -d '[:space:]' < .emscripten-version)
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$emscripten_version"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$emscripten_version"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./scripts/build-wasm.sh
      - name: Select VSIX version
        working-directory: interlis-language-tools
        shell: bash
        run: |
          set -euo pipefail
          source_version=$(node -p "require('./apps/vscode-extension/package.json').version")
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            timestamp=$(date -u -d "$CI_RUN_CREATED_AT" +%Y%m%d%H%M%S)
            version="${source_version}-SNAPSHOT.${timestamp}.${CI_RUN_ID}"
          else
            version="$source_version"
          fi
          echo "VSIX_VERSION=$version" >> "$GITHUB_ENV"
          echo "Packaging VSIX version $version"
      - name: Build and verify extension
        working-directory: interlis-language-tools
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm package:vsix
          pnpm licenses:check
          pnpm security:check
      - uses: actions/upload-artifact@v6
        with:
          name: interlis-language-tools-vsix-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: interlis-language-tools/artifacts/interlis-language-tools.vsix
          if-no-files-found: error

  marketplace:
    needs: build
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: interlis-language-tools-vsix-*
          path: artifacts
          merge-multiple: true
      # Temporary: keep Microsoft Marketplace publication disabled while the
      # verified VSIX and Open VSX publication remain available.
      - name: Publish to VS Code Marketplace (temporarily disabled)
        if: ${{ false }}
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath artifacts/interlis-language-tools.vsix --pat "$VSCE_PAT"
      - name: Preserve VSIX while Marketplace publication is disabled
        run: echo "VS Code Marketplace publication is temporarily disabled; the verified VSIX remains available as an artifact."

  open-vsx:
    needs: build
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: interlis-language-tools-vsix-*
          path: artifacts
          merge-multiple: true
      - name: Require Open VSX credentials
        shell: bash
        run: test -n "$OVSX_PAT"
      - name: Publish to Open VSX
        run: npx --yes ovsx@1.0.2 publish artifacts/interlis-language-tools.vsix --pat "$OVSX_PAT" --skip-duplicate
