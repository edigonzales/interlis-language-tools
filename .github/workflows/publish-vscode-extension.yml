name: Publish VS Code extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-extension-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact language-tools source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: interlis-language-tools
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: interlis-language-tools/pnpm-lock.yaml
      - name: Verify committed compiler lock
        id: lock
        working-directory: interlis-language-tools
        run: |
          node scripts/release-metadata.mjs check
          node scripts/release-metadata.mjs export-github-output --output "$GITHUB_OUTPUT"
      - name: Verify locked compiler packages on npm
        env:
          COMPILER_SHA: ${{ steps.lock.outputs.compiler_sha }}
          COMPILER_VERSION: ${{ steps.lock.outputs.compiler_version }}
        shell: bash
        run: |
          set -euo pipefail
          for package_name in @ilic/repository-core @ilic/tools @ilic/compiler-wasm; do
            test "$(npm view "$package_name@$COMPILER_VERSION" version)" = "$COMPILER_VERSION"
            test "$(npm view "$package_name@$COMPILER_VERSION" gitHead)" = "$COMPILER_SHA"
          done
      - name: Checkout exact locked compiler source
        uses: actions/checkout@v6
        with:
          repository: edigonzales/ilic-fork
          ref: ${{ steps.lock.outputs.compiler_sha }}
          path: ilic-fork
          persist-credentials: false
      - name: Build exact locked compiler WASM
        working-directory: ilic-fork
        env:
          ILIC_WASM_VERSION: ${{ steps.lock.outputs.compiler_version }}
        shell: bash
        run: |
          set -euo pipefail
          emscripten_version=$(tr -d '[:space:]' < .emscripten-version)
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$emscripten_version"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$emscripten_version"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./scripts/build-wasm.sh
      - name: Select deterministic VSIX version
        working-directory: interlis-language-tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_version=$(node -p "require('./apps/vscode-extension/package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$source_version"
            channel=stable
            pre_release=0
          else
            channel=snapshot
            pre_release=1
          fi
          node scripts/release-metadata.mjs manifest \
            --source-sha "$GITHUB_SHA" \
            --channel "$channel" \
            --run-id "$GITHUB_RUN_ID" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --toolchain "node-$(node -p 'process.versions.node')" \
            --output artifacts/interlis-release.json
          version=$(node -p "require('./artifacts/interlis-release.json').artifactVersion")
          {
            echo "VSIX_PRE_RELEASE=$pre_release"
            echo "VSIX_VERSION=$version"
          } >> "$GITHUB_ENV"
      - name: Build and verify extension
        working-directory: interlis-language-tools
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm package:vsix
          pnpm licenses:check
          pnpm security:check
      - uses: actions/upload-artifact@v6
        with:
          name: interlis-language-tools-vsix-${{ github.sha }}
          path: |
            interlis-language-tools/artifacts/interlis-language-tools.vsix
            interlis-language-tools/artifacts/interlis-release.json
          if-no-files-found: error

  marketplace:
    needs: build
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: interlis-language-tools-vsix-*
          path: artifacts
          merge-multiple: true
      - name: Publish to VS Code Marketplace (temporarily disabled)
        if: ${{ false }}
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath artifacts/interlis-language-tools.vsix --pat "$VSCE_PAT"
      - name: Preserve verified VSIX artifact
        run: echo "VS Code Marketplace publication remains intentionally disabled."

  open-vsx:
    needs: build
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: interlis-language-tools-vsix-*
          path: artifacts
          merge-multiple: true
      - name: Require Open VSX credentials
        shell: bash
        run: test -n "$OVSX_PAT"
      - name: Publish immutable VSIX
        run: npx --yes ovsx@1.0.2 publish artifacts/interlis-language-tools.vsix --pat "$OVSX_PAT" --skip-duplicate
