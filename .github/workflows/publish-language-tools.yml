name: Publish language-tools packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-tools-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the committed release contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_version: ${{ steps.contract.outputs.artifact_version }}
      channel: ${{ steps.contract.outputs.channel }}
      npm_dist_tag: ${{ steps.contract.outputs.npm_dist_tag }}
      source_sha: ${{ steps.contract.outputs.source_sha }}
    steps:
      - name: Checkout exact language-tools source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: interlis-language-tools
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: interlis-language-tools/pnpm-lock.yaml
      - name: Verify and export committed dependency lock
        id: lock
        working-directory: interlis-language-tools
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-metadata.mjs check
          node scripts/release-metadata.mjs export-github-output --output "$GITHUB_OUTPUT"
      - name: Verify locked compiler packages on npm
        env:
          COMPILER_SHA: ${{ steps.lock.outputs.compiler_sha }}
          COMPILER_VERSION: ${{ steps.lock.outputs.compiler_version }}
        shell: bash
        run: |
          set -euo pipefail
          for package_name in @ilic/repository-core @ilic/tools @ilic/compiler-wasm; do
            test "$(npm view "$package_name@$COMPILER_VERSION" version)" = "$COMPILER_VERSION"
            test "$(npm view "$package_name@$COMPILER_VERSION" gitHead)" = "$COMPILER_SHA"
          done
      - name: Resolve immutable package identity
        id: contract
        working-directory: interlis-language-tools
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$GITHUB_SHA"
          source_version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$source_version"
            channel=stable
            npm_dist_tag=latest
          else
            channel=snapshot
            npm_dist_tag=snapshot
          fi
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          toolchain="node-$(node -p 'process.versions.node')"
          node scripts/release-metadata.mjs manifest \
            --source-sha "$source_sha" \
            --channel "$channel" \
            --run-id "$GITHUB_RUN_ID" \
            --built-at "$built_at" \
            --toolchain "$toolchain" \
            --output artifacts/interlis-release.json
          artifact_version=$(node -p "require('./artifacts/interlis-release.json').artifactVersion")
          {
            echo "artifact_version=$artifact_version"
            echo "built_at=$built_at"
            echo "channel=$channel"
            echo "npm_dist_tag=$npm_dist_tag"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout exact locked compiler source
        uses: actions/checkout@v6
        with:
          repository: edigonzales/ilic-fork
          ref: ${{ steps.lock.outputs.compiler_sha }}
          path: ilic-fork
          persist-credentials: false
      - name: Install native compiler dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev libxml2-dev ninja-build
      - name: Build and test exact native compiler
        working-directory: ilic-fork
        run: |
          cmake -S . -B build/language-tools -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/language-tools --parallel
          ctest --test-dir build/language-tools --output-on-failure
      - name: Install pinned Emscripten SDK and build exact compiler WASM
        working-directory: ilic-fork
        env:
          ILIC_WASM_VERSION: ${{ steps.lock.outputs.compiler_version }}
        shell: bash
        run: |
          set -euo pipefail
          emscripten_version=$(tr -d '[:space:]' < .emscripten-version)
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$emscripten_version"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$emscripten_version"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./scripts/build-wasm.sh
      - name: Install, lint, typecheck, test, and build language tools
        working-directory: interlis-language-tools
        run: |
          pnpm install --frozen-lockfile
          pnpm check
      - name: Stage and verify exactly five package tarballs
        working-directory: interlis-language-tools
        env:
          RELEASE_BUILT_AT: ${{ steps.contract.outputs.built_at }}
          RELEASE_CHANNEL: ${{ steps.contract.outputs.channel }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ steps.contract.outputs.source_sha }}
        run: pnpm pack:verify
      - name: Check production licenses and vulnerabilities
        working-directory: interlis-language-tools
        run: pnpm licenses:check && pnpm security:check
      - name: Collect publish-only artifacts
        working-directory: interlis-language-tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish-artifacts
          cp artifacts/npm/*.tgz publish-artifacts/
          cp artifacts/npm/package-manifest.json publish-artifacts/
          cp artifacts/interlis-release.json publish-artifacts/
          test "$(find publish-artifacts -name '*.tgz' | wc -l | tr -d ' ')" = 5
      - uses: actions/upload-artifact@v6
        with:
          name: language-tools-release-${{ github.run_id }}
          path: interlis-language-tools/publish-artifacts
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable npm packages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: language-tools-release-${{ github.run_id }}
          path: artifacts
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.18.0
      - name: Validate artifact provenance
        env:
          EXPECTED_CHANNEL: ${{ needs.build.outputs.channel }}
          EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.build.outputs.artifact_version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./artifacts/package-manifest.json').sourceSha")" = "$EXPECTED_SHA"
          test "$(node -p "require('./artifacts/package-manifest.json').artifactVersion")" = "$EXPECTED_VERSION"
          test "$(node -p "require('./artifacts/package-manifest.json').channel")" = "$EXPECTED_CHANNEL"
          test "$(node -p "require('./artifacts/interlis-release.json').sourceSha")" = "$EXPECTED_SHA"
      - name: Publish in dependency order without replacing a version
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
          NPM_CONFIG_PROVENANCE: true
          NPM_DIST_TAG: ${{ needs.build.outputs.npm_dist_tag }}
        shell: bash
        run: |
          set -euo pipefail
          publish_if_missing() {
            local tarball="$1"
            local package_name package_version existing_git_head packed_git_head
            package_name=$(tar -xOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).name')
            package_version=$(tar -xOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
            packed_git_head=$(tar -xOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).gitHead')
            test "$packed_git_head" = "$EXPECTED_SHA"
            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              existing_git_head=$(npm view "$package_name@$package_version" gitHead 2>/dev/null || true)
              test "$existing_git_head" = "$EXPECTED_SHA"
              echo "Already published from the expected commit: $package_name@$package_version"
              return
            fi
            npm publish "$tarball" --access public --tag "$NPM_DIST_TAG"
          }
          publish_if_missing artifacts/ilic-language-service.tgz
          publish_if_missing artifacts/ilic-monaco-adapter.tgz
          publish_if_missing artifacts/ilic-diagram.tgz
          publish_if_missing artifacts/ilic-docx.tgz
          publish_if_missing artifacts/ilic-language-server.tgz
