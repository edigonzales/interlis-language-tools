name: Documentation Quality

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "test/docs/**"
      - ".github/workflows/documentation.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "test/docs/**"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node test/docs/DocumentationTest.mjs .
